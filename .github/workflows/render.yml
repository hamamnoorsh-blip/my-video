name: Render Video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition name'
        default: 'MyComp'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts ${{ github.event.inputs.composition }} out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
